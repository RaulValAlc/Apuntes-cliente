<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicios 1</title>
  </head>
  <body>
    <h1>Formulario 1</h1>
    <form action="" method="get">
      <label>Ingrese su nombre</label>
      <input type="text" name="nombre" size="30" /><br />
      Seleccione los lenguajes que conoce: <br />
      <label><input type="checkbox" name="lenguaje[]" value="java" />Java</label
      ><br />
      <label><input type="checkbox" name="lenguaje[]" value="c++" />C++</label
      ><br />
      <label
        ><input id="chkc" type="checkbox" name="lenguaje[]" value="C" />C</label
      ><br />
      <label><input type="checkbox" name="lenguaje[]" value="C#" />C#</label
      ><br />
      <input type="submit" value="Enviar" />
    </form>
    <h2>Formulario 2</h2>
    <form action="" method="get">
      <label>Ingrese su nombre</label>
      <input type="text" name="nombre" size="30" /><br />
      <label>Ingrese su mail</label>
      <input type="text" name="mail" size="30" /><br />
      <label>Comentarios</label><br />
      <textarea name="comentarios" rows="7" cols="50"></textarea><br /><br />
      <input type="submit" value="Enviar" />
    </form>
    <h3>Formulario 3</h3>
    <form action="" method="get">
      <label>Ingrese su nombre</label>
      <input type="text" name="nombre" size="30" /><br />
      Seleccione el máximo nivel de estudios que tiene: <br />
      <label
        ><input type="radio" name="estudios" value="Sin estudios" />Sin
        estudios</label
      ><br />
      <label
        ><input type="radio" name="estudios" value="Primario" />Primario</label
      ><br />
      <label
        ><input
          type="radio"
          name="estudios"
          value="Secundario"
        />Secundario</label
      ><br />
      <label
        ><input
          type="radio"
          name="estudios"
          value="Universitario"
        />Universitario</label
      ><br />
      <input type="submit" value="Enviar" />
    </form>
    <h4>Formulario 4</h4>
    <form action="" method="get">
      <label
        >Seleccione uno o varios colores (Presione Ctrl para seleccionar varios
        colores)</label
      ><br />
      <select name="colores[]" multiple size="4">
        <option value="rojo">Rojo</option>
        <option value="verde">Verde</option>
        <option value="azul">Azul</option>
        <option value="amarillo">Amarillo</option></select
      ><br />
      <input type="submit" value="Enviar" />
    </form>
    <h5>Formulario 5</h5>
    <form action="" method="get">
      <label>Seleccione una fruta o verdura:</label>
      <select name="alimento">
        <optgroup label="Frutas">
          <option value="naranjas" selected>Naranjas</option>
          <option value="manzanas">Manzanas</option>
          <option value="frutilla">Frutilla</option>
          <option value="durazno">Durazno</option>
          <option value="ciruela">Ciruela</option>
        </optgroup>
        <optgroup label="Verduras">
          <option value="lechuga">Lechuga</option>
          <option value="acelga">Acelga</option>
          <option value="zapallo">Zapallo</option>
          <option value="papas">Papas</option>
          <option value="batatas">Batatas</option>
          <option value="zanahorias">Zanahorias</option>
          <option value="rabanitos">Rabanitos</option>
          <option value="calabaza">Calabaza</option>
        </optgroup>
      </select>
      <br /><input type="submit" value="Enviar" />
    </form>
  </body>
</html>
