<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikes-LE - Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="alternate stylesheet" href="css/alternativo.css" title="Modo Oscuro">
</head>
<body>
    <header>
        <h1>Bikes-LE</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="centrado">
        <h2>Contacta con nosotros</h2>
        <form action="#" method="POST">
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <!-- Ejercicio 7: Clase para mostrar errores -->
            <p class="error-formulario">Por favor, introduce un correo electrónico válido.</p>

            <div>
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="boton-compra">Enviar Mensaje</button>
        </form>
    </main>

    <footer class="centrado">
        <p>&copy; 2026 Bikes-LE. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
